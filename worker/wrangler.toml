# Настройки Cloudflare Worker.
#
# СЕКРЕТОВ ЗДЕСЬ НЕТ И БЫТЬ НЕ ДОЛЖНО: репозиторий публичный.
# BOT_TOKEN, CHAT_ID и WEBHOOK_SECRET задаются в самом Cloudflare —
# либо кнопкой в панели (Settings -> Variables and Secrets),
# либо командой: wrangler secret put BOT_TOKEN
#
# Деплой: cd worker && npx wrangler deploy --keep-vars
# Имя должно совпадать с тем, что уже создано в панели Cloudflare, иначе деплой
# заведёт второй Worker, а webhook останется смотреть на первый.
name = "clothessale"
main = "src/index.js"
compatibility_date = "2026-09-20"

# Бесплатного тарифа Workers хватает с запасом: 100 000 запросов в сутки, а тик
# раз в минуту — это 1440 пробуждений.
workers_dev = true

# Крон: одна минута — один тик обхода. Меньше минуты Cloudflare не умеет, да и
# незачем: ответы поискового индекса кэшируются на CDN пять минут, так что
# чаще опрашивать одну и ту же страницу бессмысленно.
#
# Что делается на каждой минуте, решает plan() в src/sweep.js. Коротко:
# минуты 0 и 1 пятиминутки — живые страницы Пумы, 2-4 — каталог из индекса.
[triggers]
crons = ["* * * * *"]

# Отдельные адреса на каждую версию нам не нужны: точка входа одна, та, что
# прописана в setWebhook.
preview_urls = false

# Логи обязательны. Ошибка внутри ctx.waitUntil до Telegram не доходит: человек
# видит тишину, а причина остаётся только здесь.
[observability]
enabled = true

[observability.logs]
enabled = true

# Переменных тут нет намеренно: CHAT_ID задан в панели, репозиторий публичный.
# Поэтому деплоить только так:  npx wrangler deploy --keep-vars
# Без --keep-vars Wrangler сотрёт CHAT_ID, и бот замолчит.

# Кто нажал /start. Идентификатор хранилища — не секрет: без доступа к аккаунту
# он бесполезен. Сами chat id отдаются только по GET /subs с паролем SUBS_TOKEN.
[[kv_namespaces]]
binding = "SUBS"
id = "fa878f27cff24296acead4c3807c8e78"
