name: puma sale check

on:
  schedule:
    - cron: "7 * * * *"   # каждый час
  workflow_dispatch:       # и по кнопке Run workflow
  push:                    # и на любой коммит с кодом — чтобы можно было проверить сразу
    branches: [main]
    paths-ignore:
      - "puma.db"          # свой же коммит состояния не должен запускать новый круг
      - "*_log.txt"
      - "*.bat"

permissions:
  contents: write          # нужно, чтобы коммитить puma.db обратно

concurrency:
  group: puma-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Проверить распродажу
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py --once

      - name: Сохранить состояние
        run: |
          git config user.name "puma-bot"
          git config user.email "puma-bot@users.noreply.github.com"
          git add -f puma.db
          git diff --staged --quiet || git commit -m "state $(date -u '+%Y-%m-%d %H:%M')"
          git push
