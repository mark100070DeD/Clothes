name: puma daily audit

# Суточная сверка. Скидки ищет и рассылает Cloudflare Worker — он просыпается
# раз в минуту, и этот воркфлоу в обычной жизни ничего не отправляет.
#
# У него две обязанности:
#   1. Проверить, не врёт ли поисковый индекс. Индекс может застрять и начать
#      отдавать вчерашние цены: ошибок нет, формат правильный, новых скидок
#      «просто нет». Отличить это от спокойного дня можно только посмотрев на
#      настоящий сайт — этим и занимается --audit.
#   2. Быть сторожем самого Worker'а. Worker про свою смерть не напишет:
#      он мёртв. Если он молчит дольше STALE_HOURS, --audit кричит владельцу
#      и включает запасную рассылку, чтобы скидки продолжали приходить.
#
# Расписание суточное и намеренно на родном кроне GitHub. Частые расписания
# GitHub душит (проверено на прежнем */5, он не срабатывал вовсе), а суточное
# тянет. Дёргать его снаружи не надо — и токена для этого тоже не надо.

on:
  schedule:
    - cron: "17 5 * * *"   # раз в сутки
  workflow_dispatch:       # и по кнопке Run workflow
  push:
    branches: [main]
    paths-ignore:          # правки этих папок сверку не трогают
      - "data/**"          # свой же коммит состояния не должен запускать круг
      - "logs/**"
      - "archive/**"
      - "scripts/**"
      - "tools/**"
      - "tests/**"
      - "worker/**"      # Worker живёт на Cloudflare, сверка ему не нужна
      - "README.md"

permissions:
  contents: write          # нужно, чтобы коммитить data/puma.db обратно

concurrency:
  group: puma-check
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    # На уровне job, а не шага: собственный env шага в его же `if` не виден,
    # и условие «секрет задан» молча считалось бы ложным.
    env:
      HC_URL: ${{ secrets.HC_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Сами значения не печатаем — только факт, что секрет не пуст. Без этого
      # забытый секрет выглядит так же, как сломанный: в обоих случаях сверка
      # просто не может прочитать состояние Worker'а.
      - name: Проверить, что секреты на месте
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SUBS_TOKEN: ${{ secrets.SUBS_TOKEN }}
        run: |
          echo "WORKER_URL задан: ${WORKER_URL:+да}${WORKER_URL:-НЕТ}"
          echo "SUBS_TOKEN задан: ${SUBS_TOKEN:+да}${SUBS_TOKEN:-НЕТ}"

      - name: Сверить индекс с сайтом
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # Откуда забрать подписчиков и память Worker'а. Память нужна, чтобы
          # запасная рассылка не посчитала новыми все скидки разом.
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SUBS_TOKEN: ${{ secrets.SUBS_TOKEN }}
        run: python bot.py --audit

      # if: always() — ключевая вещь. Запомненные цены это отметки «уже
      # отправлено», и если прогон упал на середине запасной рассылки, сохранить
      # их ещё важнее: без этого назавтра всё отправленное придёт повторно.
      - name: Сохранить состояние
        if: always()
        run: bash .github/save-state.sh

      # Внешний сторож на случай «умерло сразу всё»: и Worker, и Actions.
      # Изнутри такое не ловится — некому крикнуть. Шаг включается сам, как
      # только появится секрет HC_URL (healthchecks.io и подобные, бесплатно).
      # Нет секрета — шаг молча пропускается, ошибку не вызывает.
      - name: Отметиться у внешнего монитора
        if: success() && env.HC_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HC_URL" || true
