name: puma sale check

# Полный обход сайта: раз в час, по кнопке, и на каждый пуш с изменением кода.

on:
  schedule:
    - cron: "7 * * * *"   # каждый час
  workflow_dispatch:       # и по кнопке Run workflow
  push:
    branches: [main]
    paths-ignore:          # правки этих папок бота не трогают
      - "data/**"          # свой же коммит состояния не должен запускать новый круг
      - "logs/**"
      - "archive/**"
      - "scripts/**"
      - "tools/**"
      - "tests/**"
      - "worker/**"      # Worker живёт на Cloudflare, обход ему не нужен
      - "README.md"

permissions:
  contents: write          # нужно, чтобы коммитить data/puma.db обратно

concurrency:
  group: puma-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Проверить распродажу
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # Откуда забрать тех, кто нажал /start: на команду отвечает Worker,
          # и новые подписчики появляются у него, а не в базе.
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SUBS_TOKEN: ${{ secrets.SUBS_TOKEN }}
        run: python bot.py --once

      # if: always() — ключевая вещь. Запомненные цены это отметки «уже отправлено»,
      # и если прогон упал на середине рассылки, сохранить их ещё важнее: без этого
      # через час все отправленные карточки придут повторно.
      - name: Сохранить состояние
        if: always()
        run: bash .github/save-state.sh
