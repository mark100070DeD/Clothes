name: puma answer start

# Лёгкий воркфлоу: только забирает команды из телеги и отвечает на /start.
# Сайт целиком не обходит, поэтому укладывается в ~40 секунд и может крутиться
# раз в 5 минут. Базу трогает лишь тогда, когда /start реально пришёл: витрину
# надо запомнить, иначе часовой обход пришлёт те же товары как «новую скидку».

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "logs/**"
      - "archive/**"
      - "scripts/**"
      - "tools/**"
      - "tests/**"
      - "README.md"

permissions:
  contents: write          # нужно, если витрина по /start изменила базу

concurrency:
  group: puma-check      # общая очередь с часовым обходом, чтобы не пересекались
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ответить на команды
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py --answer

      - name: Сохранить состояние
        if: always()
        run: bash .github/save-state.sh
