name: puma answer start

# Лёгкий воркфлоу: только забирает команды из телеги и отвечает на /start.
# Сайт целиком не обходит, поэтому укладывается в ~40 секунд.
# Базу трогает лишь тогда, когда /start реально пришёл: витрину надо запомнить,
# иначе часовой обход пришлёт те же товары как «новую скидку».
#
# Почему пять расписаний вместо одного: у GitHub минимальный шаг одного
# расписания — 5 минут. Но их можно положить рядом со сдвигом на минуту, и вместе
# они дают запуск каждую минуту. Это нужно ради скорости ответа: сам ответ на
# /start занимает ~31 секунду (замерено), и всё остальное время уходило на
# ожидание следующего запуска. Теперь ждать не больше минуты.
#
# Команды забирает ТОЛЬКО этот воркфлоу. Часовой обход в getUpdates не лезет:
# иначе два прогона могли бы вытащить один и тот же /start и ответить дважды.

on:
  schedule:
    - cron: "*/5 * * * *"      # 0, 5, 10, ...
    - cron: "1-59/5 * * * *"   # 1, 6, 11, ...
    - cron: "2-59/5 * * * *"   # 2, 7, 12, ...
    - cron: "3-59/5 * * * *"   # 3, 8, 13, ...
    - cron: "4-59/5 * * * *"   # 4, 9, 14, ...
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "logs/**"
      - "archive/**"
      - "scripts/**"
      - "tools/**"
      - "tests/**"
      - "README.md"

permissions:
  contents: write          # нужно, если витрина по /start изменила базу

concurrency:
  # СВОЯ очередь, не общая с часовым обходом. Раньше группа была одна, и минутный
  # воркфлоу вставал в хвост за двухминутным обходом сайта. GitHub держит в
  # ожидании только один прогон на группу и отменяет предыдущий ожидающий —
  # то есть команды могли не забираться вовсе.
  # Делить очередь больше не нужно: в getUpdates лезет только этот воркфлоу.
  group: puma-answer
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ответить на команды
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py --answer

      - name: Сохранить состояние
        if: always()
        run: bash .github/save-state.sh
