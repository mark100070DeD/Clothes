name: puma answer start

# Лёгкий воркфлоу: только забирает команды из телеги и отвечает на /start.
# Сайт целиком не обходит, поэтому укладывается в ~40 секунд.
# Базу трогает лишь тогда, когда /start реально пришёл: витрину надо запомнить,
# иначе часовой обход пришлёт те же товары как «новую скидку».
#
# ВАЖНО про расписание. Проверено по истории прогонов 20.09.2026: GitHub НЕ
# выполнил ни одного расписанного запуска этого воркфлоу, хотя он активен, —
# при том что у часового puma.yml расписание работает, пусть и с провалами по
# несколько часов. Поэтому на этот cron полагаться нельзя.
#
# Отсюда два следствия:
#   * команды разбирает не только этот воркфлоу, но и --once в puma.yml;
#   * чтобы два прогона не вытащили одну команду и не ответили дважды, очередь
#     concurrency у них общая.
#
# Если нужен ответ за секунды и без пуша — держать бота живым: scripts/run-local.bat
# на своём компе, либо внешний бесплатный cron, который дёргает workflow_dispatch.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "logs/**"
      - "archive/**"
      - "scripts/**"
      - "tools/**"
      - "tests/**"
      - "README.md"

permissions:
  contents: write          # нужно, если витрина по /start изменила базу

concurrency:
  # Общая очередь с часовым обходом. Так надо: команды читают оба воркфлоу, а два
  # одновременных getUpdates вытащили бы одно обновление дважды и ответили бы
  # витриной дважды.
  group: puma-check
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ответить на команды
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py --answer

      - name: Сохранить состояние
        if: always()
        run: bash .github/save-state.sh
